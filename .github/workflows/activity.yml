name: Activity card

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/activity.py
      - .github/workflows/activity.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/activity.py > assets/activity.svg
      # Committed as the Actions bot so the daily refresh never counts as a contribution
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update activity card"
          git pull --rebase origin main
          git push
