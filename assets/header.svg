<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Alexander Buchner">
<style>
  .name { font: 700 38px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:#f1f5f9; opacity:0; animation: up 1s .2s ease-out forwards; }
  .tag  { font: 400 15px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace; fill:#94a3b8; opacity:0; animation: up 1s .6s ease-out forwards; }
  .rule { stroke:#a5b4fc; stroke-width:2.5; stroke-linecap:round; stroke-dasharray:180; stroke-dashoffset:180; animation: draw 1.2s 1s ease-out forwards; }
  .word { font: 400 11px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace; fill:#64748b; opacity:0; animation: word 9s ease-in-out infinite; }
  .star { fill:#cbd5e1; animation: twinkle 4s ease-in-out infinite; }
  .edge { stroke:#94a3b8; stroke-width:.8; opacity:.45; }
  .edge2 { stroke:#94a3b8; stroke-width:.7; opacity:.3; }
  .node { fill:#e2e8f0; animation: node 3s ease-in-out infinite; }
  .core { fill:#ffffff; }
  .glow { animation: glow 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .net  { animation: drift 14s ease-in-out infinite alternate; }
  .mini { animation: drift2 18s ease-in-out infinite alternate; }
  .px   { fill:#334155; }
  .pxon { fill:#94a3b8; animation: px 3.6s ease-in-out infinite; }
  .packet { fill:#c7d2fe; }
  @keyframes up { from { opacity:0; transform: translateY(10px);} to { opacity:1; transform:none;} }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes word { 0%,100% { opacity:.08; transform: translateY(3px);} 50% { opacity:.55; transform: translateY(-3px);} }
  @keyframes twinkle { 0%,100% { opacity:.15;} 50% { opacity:.8;} }
  @keyframes node { 0%,100% { opacity:.7;} 50% { opacity:1;} }
  @keyframes glow { 0%,100% { opacity:.55; transform: scale(.85);} 50% { opacity:1; transform: scale(1.15);} }
  @keyframes drift { from { transform: translate(0,0);} to { transform: translate(6px,-4px);} }
  @keyframes drift2 { from { transform: translate(0,0);} to { transform: translate(-5px,3px);} }
  @keyframes px { 0%,100% { opacity:.25;} 40% { opacity:1;} }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .name, .tag { opacity:1; } .rule { stroke-dashoffset:0; } .word { opacity:.35; }
  }
</style>
