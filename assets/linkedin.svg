<svg xmlns="http://www.w3.org/2000/svg" width="210" height="40" viewBox="0 0 210 40" role="img" aria-label="Connect on LinkedIn">
  <style>
    .label { font: 600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:#f1f5f9; }
    .arrow { font: 400 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:#a5b4fc; animation: nudge 2.4s ease-in-out infinite; }
    .shine { animation: sweep 5s ease-in-out infinite; }
    .border { animation: pulse 5s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0);} 50% { transform: translateX(3px);} }
    @keyframes sweep { 0% { transform: translateX(-100px);} 45%,100% { transform: translateX(320px);} }
    @keyframes pulse { 0%,100% { stroke-opacity:.35;} 50% { stroke-opacity:.8;} }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b2540"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#c7d2fe" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="208" height="38" rx="9"/></clipPath>
  </defs>
  <rect x="1" y="1" width="208" height="38" rx="9" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect class="shine" x="0" y="-10" width="60" height="60" fill="url(#gloss)" transform="skewX(-20)"/>
  </g>
  <rect class="border" x="1" y="1" width="208" height="38" rx="9" fill="none" stroke="#a5b4fc" stroke-width="1.2"/>
  <g transform="translate(11 9)">
    <rect x="1" y="1" width="20" height="20" rx="2" fill="#ffffff"/>
    <path transform="scale(.9167)" fill="#0A66C2" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
  </g>
  <text class="label" x="44" y="25">Connect on LinkedIn</text>
  <text class="arrow" x="184" y="25">→</text>
</svg>
